name: ROS checks

on: [push, pull_request]

env:
  # Значения зафиксированы по GET https://ros.lms.ci.nsu.ru/api/course-kit (ревизия v1-w10, 2026-11-16)
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w10-3b11d37c4d46.tar.gz
  COURSE_KIT_SHA256: 3b11d37c4d467d98b8292b670ded6fedced098dc5a33d7ac0a39b549366b18e8

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full
    steps:
      # Shell выполняется без Node; JavaScript actions требуют его заранее.
      - name: Prepare Node for checkout (linux-x64)
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils
          curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-x64.tar.xz
          printf '%s  %s\n' c0649af18e6a24f6fe5535a3e86b341dd49a8e71117c8b68bde973ef834f16f2 /tmp/node.tar.xz | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate environment JSON (PR01)
        if: hashFiles('evidence/pr01/environment.json') != ''
        shell: bash
        run: python3 -m json.tool evidence/pr01/environment.json > /dev/null
      - name: Build packages and check installed launch (PR02)
        if: hashFiles('src/turtle_bringup/package.xml') != ''
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          set -o pipefail
          colcon build --symlink-install --packages-select turtle_bringup
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
      - name: Build patrol, run tests, confirm entry point (PR03)
        if: hashFiles('src/patrol/package.xml') != ''
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          set -o pipefail
          colcon build --symlink-install --packages-select patrol
          source install/setup.bash
          test -x "$(ros2 pkg prefix patrol)/lib/patrol/patrol"
          colcon test --packages-select patrol
          colcon test-result --verbose
          (cd src/patrol && python3 -m pytest test)
      - name: Build course_bringup, check QoS relay entries (PR05)
        if: hashFiles('src/course_bringup/package.xml') != ''
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          set -o pipefail
          colcon build --symlink-install
          source install/setup.bash
          test -x "$(ros2 pkg prefix patrol)/lib/patrol/pose_relay"
          test -x "$(ros2 pkg prefix patrol)/lib/patrol/sensor_listener"
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/launch/patrol.launch.py"
          python3 -m py_compile src/course_bringup/launch/patrol.launch.py
          # flake8-тесты пакета сканируют cwd: запуск строго из каталога пакета,
          # иначе colcon-сгенерированные файлы в build/ других пакетов ловят E501.
          (cd src/patrol && python3 -m pytest test)
          (cd src/course_bringup && python3 -m pytest test)
      - name: Expand xacro and test model (PR06)
        if: hashFiles('src/course_description/package.xml') != ''
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          set -o pipefail
          colcon build --symlink-install --packages-select course_description
          source install/setup.bash
          test -f "$(ros2 pkg prefix course_description)/share/course_description/urdf/vehicle.urdf.xacro"
          xacro src/course_description/urdf/vehicle.urdf.xacro > /tmp/vehicle.urdf
          python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('/tmp/vehicle.urdf').getroot(); assert r.get('name')=='course_ackermann'"
          (cd src/course_description && python3 -m pytest test)
      - name: Download course kit
        shell: bash
        run: |
          mkdir -p .course-kit
          curl -fsSLo .course-kit/course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" .course-kit/course-kit.tar.gz | sha256sum -c -
          tar -xzf .course-kit/course-kit.tar.gz -C .course-kit
      # Checker текущей сдаваемой ПР: он проверяет diff от report.commit до HEAD,
      # поэтому предыдущие ПР им на новых коммитах не гоняем (evidence уже зачтены).
      - name: Check PR06 evidence
        if: hashFiles('evidence/pr06/report.json') != ''
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR06 --submission .
