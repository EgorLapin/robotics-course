name: ROS checks

on: [push, pull_request]

env:
  # Значения зафиксированы по GET https://ros.lms.ci.nsu.ru/api/course-kit (ревизия v1-w10, 2026-11-15)
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w10-7a91d388d7bd.tar.gz
  COURSE_KIT_SHA256: 7a91d388d7bd3def7e058c8da48c32ff27ea6f14dc880a2da169c4102d456874

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:jazzy-desktop-full
    steps:
      # Shell выполняется без Node; JavaScript actions требуют его заранее.
      - name: Prepare Node for checkout (linux-x64)
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils
          curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v22.19.0/node-v22.19.0-linux-x64.tar.xz
          printf '%s  %s\n' c0649af18e6a24f6fe5535a3e86b341dd49a8e71117c8b68bde973ef834f16f2 /tmp/node.tar.xz | sha256sum -c -
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ПР01: вместо сборки — валидация environment.json; сборка turtle_bringup — с ПР02;
      # colcon build + colcon test — с ПР03. Раскомментируй нужный блок по условию работы.
      #
      # - name: Validate environment JSON
      #   shell: bash
      #   run: python3 -m json.tool evidence/pr01/environment.json > /dev/null
      #
      # - name: Build and test
      #   shell: bash
      #   run: |
      #     source /opt/ros/jazzy/setup.bash
      #     colcon build --symlink-install
      #     colcon test --event-handlers console_direct+
      #     colcon test-result --verbose
      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
      # Активируй шаг вместе со сдачей ПР01 (evidence/pr01 должен существовать):
      # - name: Check PR evidence
      #   shell: bash
      #   run: python3 .course-kit/v1/tools/check_practice.py PR01 --submission .
      - name: Kit ready (checker включается вместе со сдачей)
        shell: bash
        run: cat .course-kit/v1/VERSION
